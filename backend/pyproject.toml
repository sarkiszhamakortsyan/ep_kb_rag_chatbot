[project]
name = "omnicorp-kb-backend"
version = "0.1.0"
description = "RAG chatbot backend for the OmniCorp enterprise knowledge base"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not integration and not eval and not perf'"
markers = [
    "unit: fast, offline tests (default)",
    "integration: needs a running Ollama instance",
    "eval: retrieval-quality and latency benchmark",
    "perf: speed and performance tests (offline, timing thresholds)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
source = ["app"]
omit = ["app/evaluation/*"]  # CLI benchmarks, exercised by the eval runs

[tool.coverage.report]
show_missing = false
skip_covered = true
