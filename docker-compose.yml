# OmniCorp KB RAG chatbot: full local stack.
#
#   cp .env.example .env
#   docker compose up --build        -> http://localhost:8080
#
# Ollama runs under the "ollama" profile, enabled through COMPOSE_PROFILES in .env.
# For a Claude-only setup, set LLM_PROVIDER=anthropic and clear COMPOSE_PROFILES.
# (Embeddings still need Ollama until an in-process embedding provider exists; see ideas.md #7.)

name: omnicorp-kb

services:
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:11434:11434" # host access for local development and integration tests
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m # keep models loaded between questions (CPU load time is slow)
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot job: pulls the chat and embedding models into the shared volume, then exits.
  ollama-init:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull "$${OLLAMA_CHAT_MODEL}" && ollama pull "$${OLLAMA_EMBED_MODEL}"
    env_file:
      - path: .env
        required: false
    restart: "no"

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - backend-index:/app/data/index
    depends_on:
      ollama-init:
        condition: service_completed_successfully
        required: false # absent when the ollama profile is disabled
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama-models:
  backend-index:
