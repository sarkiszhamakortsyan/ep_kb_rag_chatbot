# OmniCorp KB RAG chatbot: full local stack.
#
#   cp .env.example .env          # optional: add ANTHROPIC_API_KEY to use Claude
#   docker compose up -d --build  # then open http://localhost:8080
#
# First start: ollama-init downloads the models (~4 GB), and the backend builds the vector
# index in the background (seconds to minutes depending on the CPU). /api/v1/health reports
# progress; the UI shows "Knowledge base loading…" until it is ready.
#
# Ollama always runs: it provides the embeddings even when Claude answers the questions
# (Anthropic has no embeddings API). A Claude-only setup without Ollama needs a non-Ollama
# embedding provider (ideas.md #7).

name: omnicorp-kb

services:
  ollama:
    image: ollama/ollama:0.34.4
    ports:
      - "127.0.0.1:11434:11434" # host access for local development and integration tests
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m # keep models loaded between questions (loading is slow on CPU)
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot job: pulls the chat and embedding models into the shared volume, then exits.
  # Already-downloaded models are only checked, so later starts are fast.
  ollama-init:
    image: ollama/ollama:0.34.4
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-gemma3:4b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-embeddinggemma}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull "$${OLLAMA_CHAT_MODEL}" && ollama pull "$${OLLAMA_EMBED_MODEL}"
    restart: "no"

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false # all settings have defaults; .env is only needed for overrides/keys
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - backend-index:/app/data/index
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    # Not published: the browser reaches the API through nginx (same origin, no CORS).

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  ollama-models:
  backend-index:
